<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字書き順アニメーター</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            min-height: 100%;
        }

        body { 
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background: #f4f7f6; color: #333;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 16px 40px; /* 下に余白を確保 */
        }
        .container { 
            background: white; padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; 
            width: 100%; max-width: 420px;
        }
        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
        input { font-size: 1.5rem; padding: 10px; width: 150px; text-align: center; border: 2px solid #e0e0e0; border-radius: 12px; outline: none; }
        button { font-size: 1rem; padding: 10px 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 12px; font-weight: bold; }
        
        #svg-container { 
            position: relative;
            width: 100%;
            /* aspect-ratio だけに頼らず、max-height でSVGが大きくなりすぎるのを防ぐ */
            aspect-ratio: 1 / 1;
            max-height: min(60vw, 340px); /* 画面の60%か340pxの小さい方 */
            background: #fff; border: 2px solid #eee; border-radius: 15px; 
            margin: 0 auto 16px; overflow: hidden;
            background-image: linear-gradient(#f9f9f9 2px, transparent 2px), linear-gradient(90deg, #f9f9f9 2px, transparent 2px);
            background-size: 50% 50%;
            display: flex; align-items: center; justify-content: center;
        }
        svg { width: 92%; height: 92%; }
        
        .info-panel { 
            text-align: left; background: #fdfdfd; padding: 12px 15px; 
            border-radius: 12px; border: 1px solid #eef2f7;
            /* 読みが長くても折り返す */
            word-break: break-all;
        }
        .info-item { margin-bottom: 8px; font-size: 1rem; line-height: 1.6; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .info-item:last-child { border-bottom: none; margin-bottom: 0; }
        .label { font-weight: bold; color: #7f8c8d; display: inline-block; min-width: 72px; font-size: 0.85rem; vertical-align: top; }
        .content { color: #2c3e50; font-size: 0.95rem; }

        .stroke { fill: none; stroke: #2c3e50; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
        .order-number { font-size: 6px; fill: #e74c3c; font-weight: bold; }

        .source-footer {
            margin-top: 18px; padding-top: 12px;
            border-top: 1px solid #eef2f7;
            font-size: 0.78rem; color: #aaa; text-align: left; line-height: 1.8;
        }
        .source-footer a { color: #aaa; text-decoration: underline dotted; }
        .source-footer a:hover { color: #3498db; }

        .subtitle {
            font-size: 0.82rem; color: #999; margin: -8px 0 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color:#2c3e50;">漢字書き順アニメーター</h2>
    <p class="subtitle">ひらがな・カタカナ・漢字（1〜2文字）の書き順を表示</p>
    <div class="controls">
        <input type="text" id="kanjiInput" maxlength="2" value="永" placeholder="ここに入力">
        <button onclick="startNewAnimation()">実行</button>
    </div>
    
    <div id="svg-container">
        <p style="color: #bbb;">文字を入力して実行</p>
    </div>

    <div id="info-panel" class="info-panel" style="display:none;">
        <div class="info-item"><span class="label">音読み</span><span id="on-yomi" class="content"></span></div>
        <div class="info-item"><span class="label">訓読み</span><span id="kun-yomi" class="content"></span></div>
    </div>

    <div class="source-footer">
        書き順データ：<a href="https://kanjivg.tagaini.net/" target="_blank">KanjiVG</a>（© Ulrich Apel, CC BY-SA 3.0）<br>
        読みデータ：<a href="https://kanjiapi.dev/" target="_blank">kanjiapi.dev</a>
    </div>
</div>

<script>
let currentAnimationId = 0;

// Unicode取得
function toUnicode(char) {
    return char.charCodeAt(0).toString(16).toLowerCase().padStart(5, '0');
}

// SVGからパスデータを取得
async function fetchPaths(char) {
    const unicode = toUnicode(char);
    const res = await fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${unicode}.svg`);
    if (!res.ok) throw new Error(`SVG not found: ${char}`);
    const text = await res.text();
    const xml = new DOMParser().parseFromString(text, "image/svg+xml");
    return Array.from(xml.querySelectorAll('path')).map(p => p.getAttribute('d'));
}

// パス長を事前計測
function measureLengths(pathsData) {
    const tempSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    tempSvg.setAttribute("viewBox", "0 0 109 109");
    tempSvg.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;";
    document.body.appendChild(tempSvg);
    const lengths = pathsData.map(d => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        tempSvg.appendChild(p);
        return p.getTotalLength();
    });
    document.body.removeChild(tempSvg);
    return lengths;
}

// rAF アニメーション（easeInOut）
function animatePath(path, length, duration) {
    return new Promise(resolve => {
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
        let startTime = null;
        function step(ts) {
            if (!startTime) startTime = ts;
            const p = Math.min((ts - startTime) / duration, 1);
            const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
            path.style.strokeDashoffset = length * (1 - e);
            if (p < 1) requestAnimationFrame(step);
            else { path.style.strokeDashoffset = 0; resolve(); }
        }
        requestAnimationFrame(step);
    });
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---- メイン ----
async function startNewAnimation() {
    const input = document.getElementById('kanjiInput').value.trim();
    if (!input) return;

    // 漢字・ひらがな・カタカナを許可（最大2文字）
    const chars = [...input].filter(c =>
        /[\u4e00-\u9fff\u3400-\u4dbf\u3041-\u3096\u30A1-\u30FA]/.test(c)
    ).slice(0, 2);
    if (chars.length === 0) return;

    const myId = ++currentAnimationId;
    const container = document.getElementById('svg-container');
    const infoPanel = document.getElementById('info-panel');
    container.innerHTML = "<p>読み込み中...</p>";
    infoPanel.style.display = "none";

    try {
        // 全漢字のパスデータを並列取得
        const allPathsData = await Promise.all(chars.map(fetchPaths));

        // 1文字かつ漢字のときだけ読みを表示
        const isKanji = c => /[\u4e00-\u9fff\u3400-\u4dbf]/.test(c);
        if (chars.length === 1 && isKanji(chars[0])) {
            const infoRes = await fetch(`https://kanjiapi.dev/v1/kanji/${encodeURIComponent(chars[0])}`);
            if (infoRes.ok) {
                const d = await infoRes.json();
                document.getElementById('on-yomi').textContent = d.on_readings.join('、') || '（なし）';
                document.getElementById('kun-yomi').textContent = d.kun_readings.join('、') || '（なし）';
                infoPanel.style.display = "block";
            }
        }

        // 全パスを順番に結合（文字ごとの区切りインデックスも記録）
        const combinedPaths = allPathsData.flat();
        const combinedLengths = measureLengths(combinedPaths);

        // 2文字の場合: SVGを横2分割レイアウトで表示
        const isTwoChars = chars.length === 2;

        await runAnimationLoop(allPathsData, combinedLengths, isTwoChars, myId);

    } catch (e) {
        container.innerHTML = `<p style='color:#e74c3c;'>データが見つかりませんでした</p>`;
    }
}

async function runAnimationLoop(allPathsData, allLengths, isTwoChars, myId) {
    const container = document.getElementById('svg-container');

    while (true) {
        if (myId !== currentAnimationId) return;

        if (isTwoChars) {
            // 横2分割: viewBox を 218x109 にして左右に並べる
            container.innerHTML = `<svg viewBox="0 0 218 109" id="kanjiSvg" style="width:96%;height:96%;"></svg>`;
        } else {
            container.innerHTML = `<svg viewBox="0 0 109 109" id="kanjiSvg"></svg>`;
        }
        const svg = document.getElementById('kanjiSvg');

        // 中央線（2文字のとき）
        if (isTwoChars) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "109"); line.setAttribute("y1", "0");
            line.setAttribute("x2", "109"); line.setAttribute("y2", "109");
            line.setAttribute("stroke", "#eee"); line.setAttribute("stroke-width", "1");
            svg.appendChild(line);
        }

        let globalStrokeIndex = 0;

        for (let charIdx = 0; charIdx < allPathsData.length; charIdx++) {
            const pathsData = allPathsData[charIdx];
            // 2文字目は x方向に109オフセット
            const offsetX = isTwoChars ? charIdx * 109 : 0;

            for (let i = 0; i < pathsData.length; i++) {
                if (myId !== currentAnimationId) return;

                const length = allLengths[globalStrokeIndex];
                const duration = Math.max(600, length * 8);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathsData[i]);
                path.setAttribute("class", "stroke");
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;

                // グループでオフセット適用（getPointAtLengthがローカル座標を返すため、pathにtransformを持たせない）
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                if (offsetX > 0) g.setAttribute("transform", `translate(${offsetX}, 0)`);
                g.appendChild(path);

                // 番号ラベル（pathのローカル座標をそのまま使う）
                const startPoint = path.getPointAtLength(0);
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", startPoint.x - 4);
                text.setAttribute("y", startPoint.y - 4);
                text.setAttribute("class", "order-number");
                text.textContent = i + 1;
                g.appendChild(text);

                svg.appendChild(g);

                await new Promise(r => requestAnimationFrame(r));
                await animatePath(path, length, duration);
                await wait(150);

                globalStrokeIndex++;
            }

            // 文字と文字の間に少し間を置く
            if (charIdx < allPathsData.length - 1) {
                await wait(500);
            }
        }

        await wait(3000);
        if (myId !== currentAnimationId) return;
    }
}
</script>
</body>
</html>
