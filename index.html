<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字書き順アニメーター</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            background: #f4f7f6; color: #333; margin: 0; padding: 20px; min-height: 100vh;
        }
        .container { 
            background: white; padding: 20px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; 
            width: 100%; max-width: 500px; box-sizing: border-box;
        }
        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
        input { font-size: 1.2rem; padding: 10px; width: 60px; text-align: center; border: 2px solid #e0e0e0; border-radius: 12px; outline: none; }
        button { font-size: 1rem; padding: 10px 20px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 12px; font-weight: bold; }
        
        #svg-container { 
            position: relative; width: 100%; aspect-ratio: 1 / 1; 
            background: #fff; border: 2px solid #eee; border-radius: 15px; 
            margin: 0 auto; overflow: hidden;
            background-image: linear-gradient(#f9f9f9 2px, transparent 2px), linear-gradient(90deg, #f9f9f9 2px, transparent 2px);
            background-size: 50% 50%;
            display: flex; align-items: center; justify-content: center;
        }
        svg { width: 90%; height: 90%; }
        .stroke { fill: none; stroke: #2c3e50; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .order-number { font-size: 6px; fill: #e74c3c; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        .active-number { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>漢字書き順アニメーター</h2>
    <div class="controls">
        <input type="text" id="kanjiInput" maxlength="1" value="永">
        <button onclick="startNewAnimation()">実行</button>
    </div>
    <div id="svg-container">
        <p style="color: #bbb;">漢字を入力して実行</p>
    </div>
</div>

<script>
let currentAnimationId = 0; // アニメーションの実行回数を管理するID

async function startNewAnimation() {
    const kanji = document.getElementById('kanjiInput').value;
    if (!kanji) return;

    // 1. 新しいアニメーションIDを発行（これにより古いループを無効化する）
    const myId = ++currentAnimationId;
    
    const container = document.getElementById('svg-container');
    container.innerHTML = "<p>読み込み中...</p>";

    const unicode = kanji.charCodeAt(0).toString(16).toLowerCase().padStart(5, '0');

    try {
        const response = await fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${unicode}.svg`);
        if (!response.ok) throw new Error();
        const svgText = await response.text();
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(svgText, "image/svg+xml");
        const pathElements = xmlDoc.querySelectorAll('path');
        const pathsData = Array.from(pathElements).map(p => p.getAttribute('d'));

        // 2. IDを渡してアニメーションを開始
        runAnimationLoop(pathsData, myId);

    } catch (e) {
        container.innerHTML = "<p style='color:#e74c3c;'>データなし</p>";
    }
}

async function runAnimationLoop(pathsData, myId) {
    const container = document.getElementById('svg-container');

    while (true) {
        // 3. ループの開始時に「自分が最新のIDか」をチェック。違えば終了。
        if (myId !== currentAnimationId) return;

        container.innerHTML = `<svg viewBox="0 0 109 109" id="kanjiSvg"></svg>`;
        const svg = document.getElementById('kanjiSvg');

        for (let i = 0; i < pathsData.length; i++) {
            // 4. 各画を描く前にもIDチェック（途中で切り替えられた場合に対応）
            if (myId !== currentAnimationId) return;

            const d = pathsData[i];
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", d);
            path.setAttribute("class", "stroke");
            svg.appendChild(path);

            const startPoint = path.getPointAtLength(0);
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", startPoint.x - 4);
            text.setAttribute("y", startPoint.y - 4);
            text.setAttribute("class", "order-number");
            text.textContent = i + 1;
            svg.appendChild(text);

            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;

            await new Promise(resolve => {
                requestAnimationFrame(() => {
                    text.classList.add('active-number');
                    const duration = Math.max(800, length * 15);
                    path.style.transition = `stroke-dashoffset ${duration}ms ease-in-out`;
                    path.style.strokeDashoffset = "0";
                    setTimeout(resolve, duration + 200);
                });
            });
        }
        
        // 5. 完了後の待機中もIDチェック
        await new Promise(resolve => setTimeout(resolve, 2000));
        if (myId !== currentAnimationId) return;
    }
}
</script>
</body>
</html>
